<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Forkware</title>
  <desc id="d">Software that everyone shapes to fit themselves. An upstream line with forks branching off; one fork returns to upstream.</desc>
  <rect width="1280" height="360" rx="24" fill="#0d1117"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="168" font-size="92" font-weight="700" fill="#f0f6fc" letter-spacing="-2">Forkware</text>
    <text x="100" y="222" font-size="28" fill="#9198a1">Software that everyone shapes to fit themselves.</text>
    <text x="100" y="272" font-size="18" fill="#3fb950" letter-spacing="3">MANIFESTO · v0.1</text>
  </g>

  <g fill="none" stroke-width="6" stroke-linecap="round">
    <!-- forks that stay their own -->
    <path d="M 860 180 C 900 180, 900 92, 950 92 L 1200 92" stroke="#3fb950"/>
    <path d="M 920 180 C 960 180, 960 268, 1010 268 L 1200 268" stroke="#3fb950"/>
    <!-- fork whose change returns to upstream -->
    <path d="M 980 180 C 1010 180, 1010 136, 1040 136 L 1080 136 C 1110 136, 1110 180, 1140 180" stroke="#a371f7"/>
    <!-- upstream -->
    <path d="M 800 180 L 1200 180" stroke="#f0f6fc"/>
  </g>

  <g stroke="#0d1117" stroke-width="5">
    <circle cx="860" cy="180" r="11" fill="#f0f6fc"/>
    <circle cx="920" cy="180" r="11" fill="#f0f6fc"/>
    <circle cx="980" cy="180" r="11" fill="#f0f6fc"/>
    <circle cx="1140" cy="180" r="14" fill="#a371f7"/>
    <circle cx="1040" cy="92" r="11" fill="#3fb950"/>
    <circle cx="1130" cy="92" r="11" fill="#3fb950"/>
    <circle cx="1080" cy="268" r="11" fill="#3fb950"/>
    <circle cx="1060" cy="136" r="11" fill="#a371f7"/>
  </g>
</svg>
